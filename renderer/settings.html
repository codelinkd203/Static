<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
<title>Static Settings</title>
<style>
  :root { color-scheme: dark; }

  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif;
  }

  .titlebar-drag {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 28px;
    -webkit-app-region: drag;
    z-index: 5;
  }

  .panel {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 34px 22px 20px;
    border-radius: 16px;
    overflow: hidden;
    background: rgba(30, 30, 34, 0.28);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07);
    color: rgba(255, 255, 255, 0.92);
  }

  h1 {
    margin: 0 0 18px;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  h2 {
    margin: 0 0 8px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: rgba(255, 255, 255, 0.4);
  }

  section {
    margin-bottom: 20px;
  }

  label.row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    font-size: 12.5px;
    color: rgba(255, 255, 255, 0.85);
    cursor: pointer;
    -webkit-app-region: no-drag;
  }

  label.row input[type="checkbox"] {
    margin: 0;
    accent-color: rgba(122, 208, 255, 0.85);
  }

  button {
    -webkit-app-region: no-drag;
    border: none;
    border-radius: 7px;
    background: rgba(255, 255, 255, 0.09);
    color: rgba(255, 255, 255, 0.9);
    font-size: 11.5px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    padding: 5px 11px;
    transition: background 140ms ease-out, transform 140ms ease-out;
  }

  button:hover {
    background: rgba(255, 255, 255, 0.15);
  }

  button:active {
    transform: scale(0.96);
  }

  .open-btn {
    padding: 4px 9px;
    font-size: 11px;
  }

  .clear-btn {
    margin-top: 10px;
    align-self: flex-start;
    background: rgba(255, 92, 92, 0.14);
    color: rgba(255, 138, 138, 0.95);
  }

  .clear-btn:hover {
    background: rgba(255, 92, 92, 0.24);
  }
</style>
</head>
<body>
  <div class="titlebar-drag"></div>

  <main class="panel">
    <h1>Settings</h1>

    <section>
      <h2>Reload</h2>
      <label class="row">
        <input type="checkbox" id="autoReloadCheckbox" />
        Auto-reload when code changes
      </label>
      <label class="row">
        <input type="checkbox" id="showReloadNoticeCheckbox" />
        Show "Reload?" notice
      </label>
    </section>

    <section>
      <h2>DevTools</h2>
      <label class="row">
        <input type="checkbox" id="errorCounterCheckbox" />
        Count errors on the DevTools badge
      </label>
      <label class="row">
        <input type="checkbox" id="devtoolsDetachedCheckbox" />
        Open DevTools in a separate window
      </label>
    </section>
  </main>

  <script src="settings.js"></script>
</body>
</html>
