<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
<title>Static Settings</title>
<link rel="stylesheet" href="settings.css" />
</head>
<body>
  <div class="titlebar-drag"></div>

  <main class="panel">
    <header class="head">
      <div class="title-row">
        <div class="app-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h10M18 7h2M4 17h2M10 17h10" />
            <circle cx="16" cy="7" r="2.3" />
            <circle cx="8" cy="17" r="2.3" />
          </svg>
        </div>
        <div>
          <h1>Settings</h1>
          <p class="sub">Tune how Static previews your site</p>
        </div>
      </div>

      <div class="seg" role="tablist" aria-label="Settings sections">
        <span class="seg-thumb" id="segThumb"></span>
        <button class="seg-btn is-active" id="tabGeneral" role="tab" aria-selected="true" data-tab="general">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" /><circle cx="16" cy="7" r="2.3" /><circle cx="8" cy="17" r="2.3" /></svg>
          General
        </button>
        <button class="seg-btn" id="tabShortcuts" role="tab" aria-selected="false" data-tab="shortcuts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="3" /><path d="M7 10h.01M11 10h.01M15 10h.01M8 14h8" /></svg>
          Shortcuts
        </button>
      </div>
    </header>

    <div class="views">
      <!-- ============ General ============ -->
      <div class="view is-active" id="viewGeneral" role="tabpanel">
        <section class="group">
          <h2>Reload</h2>
          <div class="card">
            <label class="row">
              <span class="row-icon tone-blue">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66" /><path d="M20 4v5h-5" /></svg>
              </span>
              <span class="row-text">
                <span class="row-title">Auto-reload when code changes</span>
                <span class="row-desc">Refresh the preview automatically when you save a file.</span>
              </span>
              <input type="checkbox" class="switch-input" id="autoReloadCheckbox" />
              <span class="switch" aria-hidden="true"></span>
            </label>
            <label class="row">
              <span class="row-icon tone-orange">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6" /><path d="M10 19a2 2 0 0 0 4 0" /></svg>
              </span>
              <span class="row-text">
                <span class="row-title">Show “Reload?” notice</span>
                <span class="row-desc">Offer a quick reload when a file changes.</span>
              </span>
              <input type="checkbox" class="switch-input" id="showReloadNoticeCheckbox" />
              <span class="switch" aria-hidden="true"></span>
            </label>
          </div>
        </section>

        <section class="group">
          <h2>DevTools</h2>
          <div class="card">
            <label class="row">
              <span class="row-icon tone-red">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><path d="M12 7.5v5.5" /><circle cx="12" cy="16.6" r="0.7" fill="currentColor" stroke="none" /></svg>
              </span>
              <span class="row-text">
                <span class="row-title">Count errors on the DevTools badge</span>
                <span class="row-desc">Show a running error count on the DevTools button.</span>
              </span>
              <input type="checkbox" class="switch-input" id="errorCounterCheckbox" />
              <span class="switch" aria-hidden="true"></span>
            </label>
            <label class="row">
              <span class="row-icon tone-violet">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3" /><path d="M7 10l3 2.5L7 15" /><path d="M12.5 15H17" /></svg>
              </span>
              <span class="row-text">
                <span class="row-title">Open DevTools in a separate window</span>
                <span class="row-desc">Detach DevTools instead of docking it to the preview.</span>
              </span>
              <input type="checkbox" class="switch-input" id="devtoolsDetachedCheckbox" />
              <span class="switch" aria-hidden="true"></span>
            </label>
          </div>
        </section>
      </div>

      <!-- ============ Shortcuts (filled in by settings.js) ============ -->
      <div class="view" id="viewShortcuts" role="tabpanel">
        <div id="shortcutList" style="display: contents"></div>
        <p class="note">Shortcuts are fixed and can’t be customized.</p>
      </div>
    </div>

    <footer class="foot">
      <button class="about-btn" id="aboutBtn" title="About Static">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><path d="M12 11v5.2" /><circle cx="12" cy="7.9" r="0.75" fill="currentColor" stroke="none" /></svg>
        About Static
      </button>
      <span class="foot-hint"><kbd>esc</kbd> to close</span>
    </footer>
  </main>

  <script src="settings.js"></script>
</body>
</html>
