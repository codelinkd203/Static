<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
<title>Open on phone</title>
<style>
  :root { color-scheme: dark; }

  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif;
  }

  /* This view covers the preview area while open, so clicking anywhere
     outside the card closes it. */
  .backdrop {
    position: absolute;
    inset: 0;
  }

  .card {
    position: absolute;
    top: 10px;
    right: 14px;
    width: 232px;
    padding: 12px 12px 13px;
    border-radius: 12px;
    background: rgba(38, 38, 42, 0.97);
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    color: rgba(255, 255, 255, 0.92);
    text-align: center;
    opacity: 0;
    transform: translateY(-8px) scale(0.97);
    transition: opacity 160ms ease-out, transform 160ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  .card.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .title {
    margin: 0 0 10px;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: -0.005em;
  }

  .qr-box {
    width: 190px;
    height: 190px;
    margin: 0 auto;
    border-radius: 8px;
    overflow: hidden;
    background: #fff;
  }

  .qr-box svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .url {
    margin: 10px 0 0;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.92);
    -webkit-user-select: text;
    user-select: text;
  }

  .hint {
    margin: 4px 0 0;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.5);
  }

  .empty {
    padding: 18px 4px 8px;
    font-size: 12px;
    line-height: 1.45;
    color: rgba(255, 255, 255, 0.7);
  }
</style>
</head>
<body>
  <div class="backdrop" id="backdrop"></div>

  <div class="card" id="card">
    <p class="title">Open on your phone</p>
    <div class="qr-box" id="qrBox"></div>
    <p class="url" id="qrUrl"></p>
    <p class="hint" id="qrHint">Phone must be on the same Wi-Fi</p>
  </div>

  <script src="qrcode.js"></script>
  <script src="qr-popover.js"></script>
</body>
</html>
